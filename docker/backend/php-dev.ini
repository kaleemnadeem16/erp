; PHP configuration for local development — mounted via docker/backend/Dockerfile (dev stage).

; ── Opcache ──────────────────────────────────────────────────────────────────
; revalidate_freq=2: check file timestamps every 2 seconds, not every request.
; Code changes appear within 2 seconds; restart the container to flush immediately.
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
opcache.validate_timestamps=1

; ── Error display ────────────────────────────────────────────────────────────
display_errors=On
display_startup_errors=On
error_reporting=E_ALL

; ── Limits ───────────────────────────────────────────────────────────────────
memory_limit=256M
max_execution_time=60
upload_max_filesize=20M
post_max_size=20M
