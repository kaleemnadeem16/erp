name: Pipeline

# ADR 0121: every job runs on a GitHub-hosted runner — this repository is public and has no
# self-hosted runner, so nothing a pull request can trigger reaches mainvm. lint/codegen/test
# run on every push and PR. Images (amd64 on ubuntu-latest, arm64 natively on ubuntu-24.04-arm)
# are built and pushed to GHCR only on `main` (ADR 0029). Deploying is a separate, deliberate
# act on mainvm: deploy/deploy.sh — see docs/architecture/ci-cd.md#deployment.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  lint-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - name: Pint
        working-directory: backend
        run: vendor/bin/pint --test
      - name: Larastan
        working-directory: backend
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  lint-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # One tsc invocation per workspace package — add a line here as new
      # packages/apps are scaffolded.
      - name: Typecheck core-api
        working-directory: frontend/packages/core-api
        run: npx tsc --noEmit
      - name: Typecheck core-ui
        working-directory: frontend/packages/core-ui
        run: npx tsc --noEmit
      - name: Typecheck apps/main
        working-directory: frontend/apps/main
        run: npx tsc --noEmit
      - name: Build apps/main
        working-directory: frontend/apps/main
        run: npx vite build

  test-shard:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # One process on one runner took ~31 minutes. The suite is split by file into four jobs, each with its own
    # PostgreSQL service and `erp_testing` database, so no test sees another's data. The aggregate `test` job below
    # keeps the single name the rest of the pipeline waits on.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: erp
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - name: Create erp_testing database
        # config/database.php hardcodes 'erp_testing' for the testing connection
        # regardless of DB_DATABASE — see docs/architecture/database.md.
        run: PGPASSWORD=secret psql -h 127.0.0.1 -U erp -d erp -c "CREATE DATABASE erp_testing;"
      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      - name: Pest
        working-directory: backend
        # Pest 3 has no --shard option, so split the files ourselves: round-robin over the sorted list, so a heavy
        # directory is spread across all four jobs instead of landing in one. Every file lands in exactly one shard.
        run: |
          mapfile -t files < <(find tests -name '*Test.php' | LC_ALL=C sort | awk -v s=${{ matrix.shard }} -v n=4 '(NR - 1) % n == s - 1')
          echo "shard ${{ matrix.shard }}/4: ${#files[@]} test files"
          vendor/bin/pest "${files[@]}"

  test:
    name: test
    needs: test-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every test shard must pass
        run: |
          echo "test shards: ${{ needs.test-shard.result }}"
          [ "${{ needs.test-shard.result }}" = "success" ]

  codegen-check:
    runs-on: ubuntu-24.04
    # Scramble's inference touches the database directly (e.g. resolving a
    # property fetch on the User model queries the users table's real schema),
    # so this needs the same postgres service + migrated schema as the test job
    # — not just a reachable database, this is the failure Scramble hit before
    # this was added: 08006 "could not translate host name 'postgres'", because
    # there was no service container at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: erp
      DB_PASSWORD: secret
      # migrate --force is a plain artisan command, not a Pest run, so it doesn't
      # go through tests/bootstrap.php's overrides — .env.example's CACHE_STORE=redis
      # would otherwise make the permission_tables migration's cache-clear step try
      # to resolve a "redis" host that doesn't exist here. This job never needs real
      # Redis behaviour, just for migrate not to fail.
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      - name: Migrate
        working-directory: backend
        run: php artisan migrate --force
      - name: Verify migrations roll back and re-apply cleanly
        working-directory: backend
        # RefreshDatabase (the Pest job) never calls down() — it migrates once and wraps
        # each test in a transaction. This is the only place any down() actually runs, so
        # it's the only thing that would have caught e.g. a migration silently missing a
        # down() method (found and fixed 2026-08-20: create_activity_log_table had none —
        # rollback silently no-opped instead of dropping the table).
        run: php artisan migrate:rollback --force && php artisan migrate --force
      - name: Export OpenAPI spec
        working-directory: backend
        # storage/api-docs/ is gitignored (intermediate artifact, not committed —
        # see .gitignore), so it doesn't exist in a fresh checkout.
        run: mkdir -p storage/api-docs && php artisan scramble:export --path=storage/api-docs/openapi.json
      - name: Generate TS client
        working-directory: frontend/packages/core-api
        run: npx orval --config orval.config.ts
      # ADR 0006 / api-conventions.md: a backend field change that wasn't regenerated
      # fails here, not as `undefined` in the browser.
      - name: Fail on drift
        run: git diff --exit-code -- frontend/packages/core-api

  e2e-shard:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # The browser suite is serial inside one job (~12 minutes). Playwright splits it by spec file across three jobs;
    # each job seeds its own database, so specs never share data across shards. The aggregate `e2e` job below keeps
    # the single name the rest of the pipeline waits on.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Drives the real PO -> receipt -> QA -> availability journey through a
    # real browser against the real app — php artisan serve plus the actual
    # production frontend build (vite preview, not vite dev): dev mode serves
    # every module as its own unbundled request, and a full page load can
    # trip ERR_INSUFFICIENT_RESOURCES under a constrained runner: hundreds of
    # concurrent connections for one page. The preview server is also just a
    # closer match to what a deploy actually ships. Both still bind to the
    # same :5176/:8090 pair docker-compose uses, so CORS_ALLOWED_ORIGINS/
    # SANCTUM_STATEFUL_DOMAINS' checked-in defaults (backend/.env.example)
    # work unmodified. See docs/architecture/user-interface.md's WCAG 2.2 AA
    # baseline — this is that criterion's other half, alongside the one-time
    # manual keyboard/focus audit.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: erp
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      # The browser suite opens dozens of screens in quick succession. Match
      # the development stack's raised limit so /api/v1/user does not return
      # 429 and send otherwise authenticated tests back to the sign-in page.
      API_RATE_LIMIT_PER_MINUTE: 10000
      LOGIN_RATE_LIMIT_PER_MINUTE: 10000
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, intl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend/apps/e2e
        run: npx playwright install --with-deps chromium
      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      - name: Migrate and seed demo data
        working-directory: backend
        run: php artisan migrate --force && php artisan db:seed --class="Database\\Seeders\\Demo\\DemoDatabaseSeeder" --force
      - name: Start backend
        working-directory: backend
        run: |
          php artisan serve --host=127.0.0.1 --port=8090 --no-reload &
          npx --yes wait-on@7 http://127.0.0.1:8090/up --timeout 30000
      - name: Build frontend
        working-directory: frontend
        run: npm run build --workspace apps/main
      - name: Start frontend
        working-directory: frontend/apps/main
        run: |
          npx vite preview --port 5176 &
          npx --yes wait-on@7 http://127.0.0.1:5176 --timeout 30000
      - name: Playwright
        working-directory: frontend/apps/e2e
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/apps/e2e/playwright-report/
          retention-days: 14

  e2e:
    name: e2e
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every e2e shard must pass
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ]

  build:
    name: build (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    needs: [lint-backend, lint-frontend, test, codegen-check, e2e]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          # Baked into the bundle at build time — the runtime container cannot
          # change it. Set the repository variable ERP_API_BASE_URL to the
          # public API origin (e.g. https://api-erp.example.com/api).
          build-args: |
            VITE_API_BASE_URL=${{ vars.ERP_API_BASE_URL }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

  merge-manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifest and tag latest
        run: |
          set -euo pipefail
          # Keep each imagetools invocation to one destination tag. The
          # older Buildx versions had a concurrent-map bug when one
          # invocation publishes multiple tags. The per-architecture build
          # tags are single-platform manifest lists, which imagetools can
          # combine into the final multi-platform index.
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}-arm64
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/erp-backend:latest \
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}-arm64
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }}-arm64
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/erp-frontend:latest \
            ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/erp-frontend:${{ github.sha }}-arm64
