; Production php-fpm pool overrides (loaded after the image's docker.conf and www.conf).
[www]
; The base image listens on every interface, so any container on a shared network (Traefik's proxy-net
; is shared with other applications) could speak FastCGI straight to this pool. Only the nginx in this
; same container needs it.
listen = 127.0.0.1:9000

; Pool status (active/idle workers, listen queue, "max children reached"), scraped over FastCGI by the
; php-fpm_exporter sidecar that shares this container's network namespace. Never routed by nginx.
pm.status_path = /fpm-status

; nginx already writes the access log, and the application writes one structured line per request with
; the timings (docs/architecture/observability.md); the pool's own per-request line adds only noise.
access.log = /dev/null

; A request still running after 3s dumps its PHP stack to the log: shows *where* slow code is slow.
request_slowlog_timeout = 3s
slowlog = /proc/self/fd/2
