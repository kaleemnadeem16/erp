events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Vite content-hashes filenames under /assets/, so they're safe to cache forever —
        # a changed file gets a new name, never a stale hit.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA: no real file exists per client-side route (e.g. /login) — react-router
        # resolves those in the browser, so anything not a real static file falls back
        # to index.html instead of 404ing on a page refresh/direct link.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
