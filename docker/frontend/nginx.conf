events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Vite content-hashes filenames under /assets/, so they're safe to cache forever —
        # a changed file gets a new name, never a stale hit.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The PWA entry points (vite-plugin-pwa's generateSW output) and index.html itself
        # must never be cached by the browser or an intermediate proxy (Cloudflare fronts
        # this domain) — they have stable filenames, unlike everything under /assets/, so a
        # stale cached copy here means the browser runs an old service worker whose embedded
        # precache manifest references asset hashes a newer deploy has already removed
        # entirely (each deploy replaces the container's filesystem outright, nothing from
        # the previous build persists) — surfaces as workbox's "bad-precaching-response".
        location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA: no real file exists per client-side route (e.g. /login) — react-router
        # resolves those in the browser, so anything not a real static file falls back
        # to index.html instead of 404ing on a page refresh/direct link.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
