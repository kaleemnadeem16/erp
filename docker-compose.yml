name: erp

networks:
  erp-dev:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    networks:
      - erp-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./backend:/var/www/html
      - ./docker/backend/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    networks:
      - erp-dev
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    # --max-time makes the worker exit cleanly after an hour (it is meant to be restarted, so it picks up new code);
    # without a restart policy the dev queue silently stopped an hour after every `up`.
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    networks:
      - erp-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    networks:
      - erp-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Not functional until the frontend skeleton exists (packages/, apps/main) — see
  # phase-0-foundation.md "Frontend skeleton".
  node-volume-init:
    image: node:22-alpine
    working_dir: /app
    entrypoint: ["/usr/local/bin/erp-node-volume-init"]
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - ./frontend:/app
      - ./docker/frontend/dev-entrypoint.sh:/usr/local/bin/erp-node-volume-init:ro
      - frontend_node_modules:/app/node_modules

  node:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    # host/port are set in apps/main/vite.config.ts (not passed as CLI flags here) —
    # `npm run dev` forwards through a nested workspace call and mangles `-- --flag`
    # args passed that way, which silently fell back to Vite's default port 5173.
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "5176:5176"
    networks:
      - erp-dev
    depends_on:
      node-volume-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Init script runs ONLY on a fresh volume (first start with empty data dir).
      # Creates erp_testing alongside erp so tests never touch dev data.
      - ./docker/backend/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - erp-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Throwaway database server for the backend test suite (opt-in: `--profile test-db`, started by docker/backend/run-tests-tmpfs.sh,
  # which gives every agent its own database on it). The data directory is RAM and fsync is off: a stop loses everything, which is
  # fine because each run rebuilds its schema. See docs/architecture/environments.md "Test database on tmpfs".
  #
  # Space budget for the 1280m tmpfs (measured 2026-10-19: a migrated database is ~18 MB, one migration run writes ~13 MB of WAL):
  #   WAL   <= ~384 MB  max_wal_size is a soft limit, so budget 1.5x of it. It used to be 1 GB inside a 768 MB tmpfs: on 2026-10-02
  #                     the disk filled, WAL writing hit PANIC "No space left on device" and the server aborted.
  #   data  ~  60 MB x up to ~8 agent/migration databases = ~480 MB, which leaves ~400 MB of headroom for temp files.
  # RAM is only used as the files grow; the WSL VM has 7.5 GB shared with the editors and agents. The wrapper refuses to start a
  # run above 90% full.
  #
  # Diagnostics (bounded; no connection logging, no query text beyond what PostgreSQL already logs with an error): every line
  # carries time, PID, application name (erp-test:<agent>:<database>, set by the wrapper), user@database and the source
  # file:line of the message, so an unexplained backend exit can be matched to the run that was live (the wrapper also keeps a
  # run journal in /tmp/erp-test-locks/runs.log).
  postgres-test:
    profiles: ["test-db"]
    image: postgres:16
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
      - -c
      - max_wal_size=256MB
      - -c
      - "log_line_prefix=%m [%p] %a %u@%d "
      - -c
      - log_error_verbosity=verbose
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_DB: erp_testing
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: secret
    tmpfs:
      - /var/lib/postgresql/data:size=1280m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - erp-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_testing"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-bookworm
    ports:
      - "6379:6379"
    networks:
      - erp-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  backend_vendor:
  frontend_node_modules:
