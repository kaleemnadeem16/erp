[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
; Docker sends SIGTERM on container stop/recreate (every deploy); supervisor
; forwards it as-is by default. Both php-fpm and nginx treat TERM as an
; immediate/fast shutdown that drops in-flight requests outright — QUIT is
; each process's graceful-shutdown signal (finish what's in flight, then
; exit), which is what a rolling `docker compose up -d` recreate needs.
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
