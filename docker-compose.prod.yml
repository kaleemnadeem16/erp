# Production. No postgres or redis service — connects to dbvm's existing instances
# (docs/architecture/environments.md). Deployed as its own Compose project on mainvm,
# matching the invoiceflow/crm pattern. Set the real hostnames below before first deploy.
networks:
  proxy-net:
    external: true
  # Where Prometheus (the monitoring stack) scrapes the exporters below.
  monitoring-net:
    external: true
    name: monitoring_monitoring-net
  erp-internal:
    driver: bridge

services:
  app:
    image: ghcr.io/kaleemnadeem16/erp-backend:latest
    container_name: erp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Application logs as JSON lines on stderr -> Docker -> Promtail -> Loki (config/logging.php).
      LOG_STACK: json
    # No log bind mounts. Docker creates a bind-mount target root-owned, but
    # php-fpm runs as www-data and could not write into it, so Monolog threw on
    # its first write; and mounting over /var/log/nginx shadowed the
    # /dev/stdout symlinks the image sets up, hiding nginx logs from
    # `docker logs`. Both streams go to the json-file driver configured below.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-net
      - erp-internal
      - monitoring-net
    # Backs both the deploy job's `docker compose up -d --wait` (don't run
    # permission:register against a container that isn't accepting connections
    # yet) and Traefik's own active healthcheck below (don't route real
    # traffic to it either) — single replica, so this is what stands in for a
    # rolling deploy without needing Swarm/multi-replica infra.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-net
      # HTTPS router
      - traefik.http.routers.erp-api.rule=Host(`${ERP_API_HOST:?set ERP_API_HOST in .env}`)
      - traefik.http.routers.erp-api.entrypoints=websecure
      - traefik.http.routers.erp-api.tls=true
      - traefik.http.routers.erp-api.middlewares=erp-api-retry
      # HTTP router -> redirect to HTTPS
      - traefik.http.routers.erp-api-http.rule=Host(`${ERP_API_HOST:?set ERP_API_HOST in .env}`)
      - traefik.http.routers.erp-api-http.entrypoints=web
      - traefik.http.routers.erp-api-http.middlewares=erp-redirect-https
      # Redirect middleware
      - traefik.http.middlewares.erp-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.erp-redirect-https.redirectscheme.permanent=true
      # Retries a request that lands exactly in a deploy's restart gap against
      # the (by then updated) backend pool — paired with supervisord's
      # stopsignal=QUIT and the loadbalancer healthcheck below; none of the
      # three closes this alone on a single-replica deploy.
      - traefik.http.middlewares.erp-api-retry.retry.attempts=4
      - traefik.http.middlewares.erp-api-retry.retry.initialinterval=250ms
      # Service port
      - traefik.http.services.erp-api.loadbalancer.server.port=80
      # Don't send traffic to a container until it actually answers /up —
      # otherwise Traefik adds a just-started container to the pool the
      # instant Docker reports it running, before php-fpm/nginx inside are
      # ready to accept connections.
      - traefik.http.services.erp-api.loadbalancer.healthcheck.path=/up
      - traefik.http.services.erp-api.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.erp-api.loadbalancer.healthcheck.timeout=3s

  frontend:
    image: ghcr.io/kaleemnadeem16/erp-frontend:latest
    container_name: erp-frontend
    restart: unless-stopped
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-net
      - traefik.http.routers.erp-frontend.rule=Host(`${ERP_FRONTEND_HOST:?set ERP_FRONTEND_HOST in .env}`)
      - traefik.http.routers.erp-frontend.entrypoints=websecure
      - traefik.http.routers.erp-frontend.tls=true
      - traefik.http.routers.erp-frontend.middlewares=erp-frontend-retry
      - traefik.http.routers.erp-frontend-http.rule=Host(`${ERP_FRONTEND_HOST:?set ERP_FRONTEND_HOST in .env}`)
      - traefik.http.routers.erp-frontend-http.entrypoints=web
      - traefik.http.routers.erp-frontend-http.middlewares=erp-redirect-https
      - traefik.http.middlewares.erp-frontend-retry.retry.attempts=4
      - traefik.http.middlewares.erp-frontend-retry.retry.initialinterval=250ms
      - traefik.http.services.erp-frontend.loadbalancer.server.port=80
      - traefik.http.services.erp-frontend.loadbalancer.healthcheck.path=/
      - traefik.http.services.erp-frontend.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.erp-frontend.loadbalancer.healthcheck.timeout=3s

  worker:
    image: ghcr.io/kaleemnadeem16/erp-backend:latest
    container_name: erp-queue-worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    environment:
      LOG_STACK: json
    volumes:
      - ./logs/laravel:/var/www/html/storage/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-internal

  scheduler:
    image: ghcr.io/kaleemnadeem16/erp-backend:latest
    container_name: erp-scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    env_file:
      - .env
    environment:
      LOG_STACK: json
    volumes:
      - ./logs/laravel:/var/www/html/storage/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-internal

  # Metrics sidecars. Each shares the app container's network namespace (network_mode), so it reaches
  # php-fpm and nginx's status page on loopback — neither is exposed on any network — and Prometheus
  # scrapes the exporters' own ports (9253, 9113) over monitoring-net. See docs/architecture/observability.md.
  fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: erp-fpm-exporter
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
    environment:
      PHP_FPM_SCRAPE_URI: tcp://127.0.0.1:9000/fpm-status
      PHP_FPM_LOG_LEVEL: warn
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: erp-nginx-exporter
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
    command: ["--nginx.scrape-uri=http://127.0.0.1:8081/nginx-status"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
