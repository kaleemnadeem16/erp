events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Health checks hit /up every few seconds from Traefik and Docker; keep them out of the access log.
    map $request_uri $loggable {
        ~^/up(\?|$) 0;
        default      1;
    }
    access_log /var/log/nginx/access.log combined if=$loggable;

    # Connection counters for the nginx exporter sidecar. Loopback only: it is on a second port that
    # Traefik does not route to, and the sidecar shares this container's network namespace.
    server {
        listen 127.0.0.1:8081;
        location = /nginx-status {
            stub_status;
            access_log off;
        }
    }

    server {
        listen 80;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
